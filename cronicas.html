<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crónicas — GeekNoticias</title>
<meta name="description" content="Crónicas de Franco Islas sobre tecnología y vida cotidiana en Chile y Latinoamérica. Ensayo personal generado con IA, no noticias verificadas.">
<link rel="canonical" href="https://geeknoticias.com/cronicas.html">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5927579839118584"
     crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfdfd; --card-bg:#fff; --text:#292929; --text-dim:#71717a; --title:#18181b;
    --border:#e7e7e9; --accent:#0d7d5e; --accent-soft:rgba(13,125,94,0.1); --chip-bg:#f4f4f5; --footer-bg:#111111; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111111; --card-bg:#18181b; --text:#c9c9cc; --text-dim:#8b8b93; --title:#f4f4f5;
      --border:#2a2a2e; --accent:#3ddba0; --accent-soft:rgba(61,219,160,0.14); --chip-bg:#232327;
    }
  }
  :root[data-theme="light"]{
    --bg:#fdfdfd; --card-bg:#fff; --text:#292929; --text-dim:#71717a; --title:#18181b;
    --border:#e7e7e9; --accent:#0d7d5e; --accent-soft:rgba(13,125,94,0.1); --chip-bg:#f4f4f5;
  }
  :root[data-theme="dark"]{
    --bg:#111111; --card-bg:#18181b; --text:#c9c9cc; --text-dim:#8b8b93; --title:#f4f4f5;
    --border:#2a2a2e; --accent:#3ddba0; --accent-soft:rgba(61,219,160,0.14); --chip-bg:#232327;
  }
  .theme-toggle{position:fixed; right:20px; bottom:20px; width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--card-bg); color:var(--text); font-size:19px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.14); z-index:70; display:flex; align-items:center; justify-content:center; transition:transform .15s ease;}
  .theme-toggle:hover{transform:scale(1.08);}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  header{position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .header__inner{max-width:1180px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;}
  .logo{font-size:19px; font-weight:800; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px;}
  .logo img{width:26px; height:26px; border-radius:6px; display:block;}
  .logo .dot{color:var(--accent);}
  .header__inner nav a{font-size:13px; font-weight:600; color:var(--text-dim);}

  .hero{max-width:1180px; margin:0 auto; padding:48px 20px 8px; animation:fadeUp .5s ease both;}
  .hero h1{font-family:'Playfair Display', serif; font-style:italic; font-size:clamp(28px,4.4vw,42px); font-weight:600; line-height:1.1; margin:0 0 10px; color:var(--title);}
  .hero p{color:var(--text-dim); font-size:15px; margin:0 0 4px; max-width:60ch;}
  .aviso{font-size:12.5px; color:var(--accent); font-weight:600;}

  .section{max-width:1180px; margin:0 auto; padding:26px 20px 60px;}
  .grid{display:grid; gap:22px; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));}
  .empty{grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-dim); font-size:14px;}

  .card{background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(0,0,0,0.04); transition:transform .2s ease, box-shadow .2s ease; opacity:0; transform:translateY(14px); animation:fadeUp .45s ease forwards; animation-delay:calc(var(--i, 0) * 60ms);}
  .card:hover{transform:translateY(-4px); box-shadow:0 14px 30px rgba(0,0,0,0.09);}
  .card:hover .card__media img{transform:scale(1.05);}
  .card__media{aspect-ratio:16/9; background:var(--chip-bg); overflow:hidden;}
  .card__media img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .card__body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:9px; flex:1;}
  .card__cat{font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); background:var(--accent-soft); display:inline-block; padding:3px 9px; border-radius:5px; width:fit-content;}
  .card__title{font-family:'Playfair Display', serif; font-style:italic; font-size:18px; font-weight:600; line-height:1.35; color:var(--title);}
  .card__resumen{font-size:13.5px; color:var(--text-dim); line-height:1.5;}

  footer{background:var(--footer-bg); color:rgba(255,255,255,0.55); padding:30px 20px; text-align:center; font-size:12.5px; margin-top:24px;}
  footer a{color:rgba(255,255,255,0.8);}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
</style>
<script>
(function () {
  const saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
})();
</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar entre tema claro y oscuro">🌙</button>
<header>
  <div class="header__inner">
    <a class="logo" href="/"><img src="/img/logo.png" alt="" width="26" height="26">Geek<span class="dot">Noticias</span></a>
    <nav><a href="/">← Noticias</a> &nbsp; <a href="/historias.html">Historias</a></nav>
  </div>
</header>

<div class="hero">
  <h1>Crónicas</h1>
  <p>Ensayos personales de Franco Islas sobre tecnología y vida cotidiana en Chile y Latinoamérica. Publica miércoles y domingo.</p>
  <div class="aviso">Crónica de opinión generada con IA — no son noticias verificadas.</div>
</div>

<div class="section">
  <div class="grid" id="grid">
    <div class="empty">Cargando crónicas…</div>
  </div>
</div>

<footer>© <span id="year"></span> GeekNoticias · <a href="/privacidad.html">Privacidad</a> · <a href="/terminos.html">Términos</a></footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const grid = document.getElementById('grid');

function cardHtml(c, i) {
  const img = c.imagen_url ? `<img src="${c.imagen_url}" alt="" loading="lazy">` : '';
  return `<a class="card" style="--i:${i}" href="/cronica/${encodeURIComponent(c.slug)}">
    <div class="card__media">${img}</div>
    <div class="card__body">
      <span class="card__cat">Crónica</span>
      <div class="card__title">${c.titulo}</div>
      <div class="card__resumen">${c.resumen}</div>
    </div>
  </a>`;
}

fetch('/api/cronicas')
  .then((r) => r.json())
  .then(({ cronicas }) => {
    grid.innerHTML = (cronicas && cronicas.length)
      ? cronicas.map((c, i) => cardHtml(c, i)).join('')
      : '<div class="empty">Todavía no hay crónicas publicadas. Volvé el miércoles o domingo.</div>';
  })
  .catch(() => { grid.innerHTML = '<div class="empty">No se pudieron cargar las crónicas.</div>'; });

const themeToggleBtn = document.getElementById('themeToggle');
function systemPrefersDark() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function currentTheme() {
  return document.documentElement.dataset.theme || (systemPrefersDark() ? 'dark' : 'light');
}
function applyThemeIcon() {
  themeToggleBtn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
themeToggleBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  applyThemeIcon();
});
applyThemeIcon();
</script>
</body>
</html>
